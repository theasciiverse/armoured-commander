[package]
name = "armoured-commander"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Armoured Commander, the WWII tank commander roguelike, ported to the terminal for the Asciiverse catalog"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "armcom"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
flate2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
roxmltree = "0.21.1"
# decoding and mixing everywhere; on Linux the output is our own (src/alsa.rs),
# so the binary does not link libasound
rodio = { version = "0.23.0", default-features = false, features = ["wav"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }

[profile.release]
debug = 1
